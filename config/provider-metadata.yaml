            - |-
              # The id for importing a wiz_project_cloud_account_link has to be in this format: 'link|<project_id>|<cloud_account_id>'
              terraform import wiz_project_cloud_account_link.example_import "link|ee25cc95-82b0-4543-8934-5bc655b86786|5cc3a684-44cb-4cd5-b78f-f029c25dc617"
    wiz_report_graph_query:
        subCategory: ""
        description: A GraphQL Query Report is an automated query that can be scheduled to run at hourly intervals.
        name: wiz_report_graph_query
        title: wiz_report_graph_query Resource - terraform-provider-wiz
        examples:
            - name: foo
              manifest: |-
                {
                  "name": "foo",
                  "project_id": "2c38b8fa-c315-57ea-9de4-e3a19592d796",
                  "query": "{\n  \"select\": true,\n  \"type\": [\n    \"CONTAINER_IMAGE\"\n  ],\n  \"where\": {\n    \"name\": {\n      \"CONTAINS\": [\n        \"foo\"\n      ]\n    }\n  }\n}\n"
                }
            - name: foo
              manifest: |-
                {
                  "name": "foo",
                  "project_id": "2c38b8fa-c315-57ea-9de4-e3a19592d796",
                  "query": "{\n  \"select\": true,\n  \"type\": [\n    \"CONTAINER_IMAGE\"\n  ],\n  \"where\": {\n    \"name\": {\n      \"CONTAINS\": [\n        \"foo\"\n      ]\n    }\n  }\n}\n",
                  "run_interval_hours": 24,
                  "run_starts_at": "2023-12-06 16:00:00 +0000 UTC"
                }
        argumentDocs:
            '*': .
            id: (String) The ID of this resource.
            name: (String) Name of the Report.
            project_id: (String) The ID of the project that this report belongs to (changing this requires re-creatting the report). Defaults to all projects.
            query: (String) The query that the report will run. Required by the GRAPH_QUERY report type.
            run_interval_hours: (Number) Run interval for scheduled reports (in hours).
            run_starts_at: '(String) String representing the time and date when the scheduling should start (required when run_interval_hours is set). Must be in the following format: 2006-01-02 15:04:05 +0000 UTC. Also, Wiz will always round this down by the hour.'
        importStatements: []
    wiz_saml_group_mapping:
        subCategory: ""
        description: Configure SAML Group Role Mapping. When using SSO to authenticate with Wiz, you can map group memberships in SAML assertions to Wiz roles across specific scopes.
        name: wiz_saml_group_mapping
        title: wiz_saml_group_mapping Resource - terraform-provider-wiz
        examples:
            - name: test_global_scope
              manifest: |-
                {
                  "group_mappings": [
                    {
                      "provider_group_id": "global-reader-group-id",
                      "role": "PROJECT_READER"
                    }
                  ],
                  "saml_idp_id": "test-saml-identity-provider"
                }
            - name: test_global_scope
              manifest: |-
                {
                  "group_mappings": [
                    {
                      "description": "Global Reader group mapping",
                      "provider_group_id": "global-reader-group-id",
                      "role": "PROJECT_READER"
                    }
                  ],
                  "saml_idp_id": "test-saml-identity-provider"
                }
            - name: test_single_project
              manifest: |-
                {
                  "group_mappings": [
                    {
                      "projects": [
                        "ee25cc95-82b0-4543-8934-5bc655b86786"
                      ],
                      "provider_group_id": "admin-group-id",
                      "role": "PROJECT_ADMIN"
                    }
                  ],
                  "saml_idp_id": "test-saml-identity-provider"
                }
            - name: test_multi_project
              manifest: |-
                {
                  "group_mappings": [
                    {
                      "projects": [
                        "ee25cc95-82b0-4543-8934-5bc655b86786",
                        "e7f6542c-81f6-43cf-af48-bdd77f09650d"
                      ],
                      "provider_group_id": "member-group-id",
                      "role": "PROJECT_MEMBER"
                    }
                  ],
                  "saml_idp_id": "test-saml-identity-provider"
                }
            - name: test_multi_mappings
              manifest: |-
                {
                  "group_mappings": [
                    {
                      "provider_group_id": "global-reader-group-id",
                      "role": "PROJECT_READER"
                    },
                    {
                      "projects": [
                        "ee25cc95-82b0-4543-8934-5bc655b86786"
                      ],
                      "provider_group_id": "admin-group-id",
                      "role": "PROJECT_ADMIN"
                    },
                    {
                      "projects": [
                        "ee25cc95-82b0-4543-8934-5bc655b86786",
                        "e7f6542c-81f6-43cf-af48-bdd77f09650d"
                      ],
                      "provider_group_id": "member-group-id",
                      "role": "PROJECT_MEMBER"
                    }
                  ],
                  "saml_idp_id": "test-saml-identity-provider"
                }
        argumentDocs:
            description: (String) Group Mapping description
            group_mapping: '(Block Set, Min: 1) (see below for nested schema)'
            id: (String) Unique tf-internal identifier for the saml group mapping
            projects: (List of String) Project mapping
            provider_group_id: (String) Provider group ID
            role: (String) Wiz Role name
            saml_idp_id: (String) Identifier for the Saml Provider
        importStatements:
            - |-
              # The id for importing resources has to be in this format: 'mapping|<saml_idp_id>|<provider_group_id>:<project_ids>:<role>#...'.
              # Import with saml mapping to multiple projects
              terraform import wiz_saml_group_mapping.example_import "mapping|wiz-azure-ad-saml|88990357-fe36-421b-aedc-fcdd602b91d7:bb62aac7-e8bd-5d5e-b205-2dbafe106e1a,ee25cc95-82b0-4543-8934-5bc655b86786:PROJECT_READER"

              # Import with mapping to single project
              terraform import wiz_saml_group_mapping.example_import "mapping|wiz-azure-ad-saml|88990357-fe36-421b-aedc-fcdd602b91d7:bb62aac7-e8bd-5d5e-b205-2dbafe106e1a:PROJECT_READER"

              # Import with global mapping
              terraform import wiz_saml_group_mapping.example_import "mapping|wiz-azure-ad-saml|88990357-fe36-421b-aedc-fcdd602b91d7::PROJECT_READER"

              # Import with multiple group mappings
              terraform import wiz_saml_group_mapping.example_import "mapping|wiz-azure-ad-saml|88990357-fe36-421b-aedc-fcdd602b91d7:bb62aac7-e8bd-5d5e-b205-2dbafe106e1a:PROJECT_READER#12345678-1234-1234-1234-123456789012:ee25cc95-82b0-4543-8934-5bc655b86786:PROJECT_WRITER"
