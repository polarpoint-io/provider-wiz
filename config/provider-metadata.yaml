name: jschoombee/wiz
resources:
    wiz_automation_rule_aws_sns:
        subCategory: ""
        description: Automation Rules define associations between actions and findings.
        name: wiz_automation_rule_aws_sns
        title: wiz_automation_rule_aws_sns Resource - terraform-provider-wiz
        examples:
            - name: example
              manifest: |-
                {
                  "aws_sns_body": "${jsonencode({\n    \"trigger\" : {\n      \"source\" : \"{{triggerSource}}\",\n      \"type\" : \"{{triggerType}}\",\n      \"ruleId\" : \"{{ruleId}}\",\n      \"ruleName\" : \"{{ruleName}}\"\n    },\n    \"issue\" : {\n      \"id\" : \"{{issue.id}}\",\n      \"status\" : \"{{issue.status}}\",\n      \"severity\" : \"{{issue.severity}}\",\n      \"created\" : \"{{issue.createdAt}}\",\n      \"projects\" : \"{{#issue.projects}}{{name}}, {{/issue.projects}}\"\n    },\n    \"resource\" : {\n      \"id\" : \"{{issue.entitySnapshot.providerId}}\",\n      \"name\" : \"{{issue.entitySnapshot.name}}\",\n      \"type\" : \"{{issue.entitySnapshot.nativeType}}\",\n      \"cloudPlatform\" : \"{{issue.entitySnapshot.cloudPlatform}}\",\n      \"subscriptionId\" : \"{{issue.entitySnapshot.subscriptionExternalId}}\",\n      \"subscriptionName\" : \"{{issue.entitySnapshot.subscriptionName}}\",\n      \"region\" : \"{{issue.entitySnapshot.region}}\",\n      \"status\" : \"{{issue.entitySnapshot.status}}\",\n      \"cloudProviderURL\" : \"{{issue.entitySnapshot.cloudProviderURL}}\"\n    },\n    \"control\" : {\n      \"id\" : \"{{issue.control.id}}\",\n      \"name\" : \"{{issue.control.name}}\",\n      \"description\" : \"{{issue.control.description}}\",\n      \"severity\" : \"{{issue.control.severity}}\",\n      \"sourceCloudConfigurationRuleId\" : \"{{issue.control.sourceCloudConfigurationRule.shortId}}\",\n      \"sourceCloudConfigurationRuleName\" : \"{{issue.control.sourceCloudConfigurationRule.name}}\"\n    }\n  })}",
                  "description": "example description",
                  "enabled": true,
                  "filters": "${jsonencode({\n    \"project\" : [],\n    \"relatedEntity\" : {\n      \"cloudPlatform\" : [\n        \"AWS\"\n      ],\n      \"subscriptionId\" : [\n        \"fccc3f07-3304-4f9d-ac2d-a43dd6128eb0\",\n        \"a005e165-49c5-41b7-befb-a0e4d866fc6c\",\n      ]\n    },\n    \"sourceControl\" : [\n      \"b46c34d2-3624-4e1e-bb04-dda5177582c7\",\n      \"6c27d70a-7329-42e9-b19e-0b974f556365\",\n    ]\n  })}",
                  "integration_id": "${wiz_integration_aws_sns.example.id}",
                  "name": "example",
                  "trigger_source": "ISSUES",
                  "trigger_type": [
                    "CREATED",
                    "REOPENED"
                  ]
                }
              references:
                integration_id: wiz_integration_aws_sns.example.id
              dependencies:
                wiz_integration_aws_sns.example: |-
                    {
                      "aws_sns_access_method": "ASSUME_SPECIFIED_ROLE",
                      "aws_sns_customer_role_arn": "arn:aws:iam::123456789012:role/Example-Role",
                      "aws_sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:Example",
                      "name": "example",
                      "scope": "All Resources, Restrict this Integration to global roles only"
                    }
        argumentDocs:
            action_id: (String) Wiz internal ID for the action.
            aws_sns_body: (String) AWS SNS body.
            created_at: (String) The date/time at which the automation rule was created.
            description: (String) Description of the automation rule
            enabled: (Boolean) Enabled?
            filters: (String) Value should be wrapped in jsonencode() to avoid diff detection. This is required even though the API states it is not required.  Validate is performed by the UI.
            id: (String) Wiz internal identifier.
            integration_id: (String) Wiz identifier for the Integration to leverage for this action. Must be resource type integration_aws_sns.
            name: (String) Name of the automation rule
            project_id: (String) Wiz internal ID for a project.
            trigger_source: (String) Trigger source.
            trigger_type: (List of String) Trigger type.
            "true": .
        importStatements: []
