apiVersion: report.wiz.m.polarpoint.io/v1alpha1
kind: GraphQuery
metadata:
  annotations:
    meta.upbound.io/example-id: report/v1alpha1/graphquery
  labels:
    testing.upbound.io/example-name: foo
  name: foo
  namespace: crossplane-system
spec:
  forProvider:
    name: foo
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    query: |
      {
        "select": true,
        "type": [
          "CONTAINER_IMAGE"
        ],
        "where": {
          "name": {
            "CONTAINS": [
              "foo"
            ]
          }
        }
      }
