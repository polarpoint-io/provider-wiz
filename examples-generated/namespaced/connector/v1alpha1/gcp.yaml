apiVersion: connector.wiz.m.polarpoint.io/v1alpha1
kind: GCP
metadata:
  annotations:
    meta.upbound.io/example-id: connector/v1alpha1/gcp
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    authParamsSecretRef:
      key: example-key
      name: example-secret
    extraConfig: |-
      ${jsonencode(
          {
            "projects" : [],
            "excludedProjects" : [],
            "includedFolders" : [],
            "excludedFolders" : [],
            "auditLogMonitorEnabled" : false
          }
        )}
    name: example
