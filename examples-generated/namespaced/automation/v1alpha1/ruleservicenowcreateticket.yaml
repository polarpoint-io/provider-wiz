apiVersion: automation.wiz.m.polarpoint.io/v1alpha1
kind: RuleServiceNowCreateTicket
metadata:
  annotations:
    meta.upbound.io/example-id: automation/v1alpha1/ruleservicenowcreateticket
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    description: example description
    enabled: true
    filters: |-
      ${jsonencode({
          "severity" : [
            "CRITICAL"
          ]
        })}
    integrationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    name: example
    servicenowDescription: "Description:  {{issue.description}}\nStatus:       {{issue.status}}\nCreated:
      \     {{issue.createdAt}}\nSeverity:     {{issue.severity}}\nProject:      {{#issue.projects}}{{name}},
      {{/issue.projects}}\n\n---\nResource:\t            {{issue.entitySnapshot.name}}\nType:\t
      \               {{issue.entitySnapshot.nativeType}}\nCloud Platform:\t        {{issue.entitySnapshot.cloudPlatform}}\nCloud
      Resource URL:     {{issue.entitySnapshot.cloudProviderURL}}\nSubscription Name
      (ID): {{issue.entitySnapshot.subscriptionName}} ({{issue.entitySnapshot.subscriptionExternalId}})\nRegion:\t
      \               {{issue.entitySnapshot.region}}\nPlease click the following
      link to proceed to investigate the issue:\nhttps://{{wizDomain}}/issues#~(issue~'{{issue.id}})\nSource
      Automation Rule: {{ruleName}}\n"
    servicenowSummary: 'Wiz Issue: {{issue.control.name}}'
    servicenowTableName: incident
    triggerSource: ISSUES
    triggerType:
    - CREATED

---

apiVersion: integration.wiz.m.polarpoint.io/v1alpha1
kind: ServiceNow
metadata:
  annotations:
    meta.upbound.io/example-id: automation/v1alpha1/ruleservicenowcreateticket
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: crossplane-system
spec:
  forProvider:
    name: default
    scope: All Resources, Restrict this Integration to global roles only
    servicenowPasswordSecretRef:
      key: example-key
      name: example-secret
    servicenowUrl: ${var.servicename_url}
    servicenowUsername: ${var.servicenow_username}
