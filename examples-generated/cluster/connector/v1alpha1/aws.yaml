apiVersion: connector.wiz.polarpoint.io/v1alpha1
kind: AWS
metadata:
  annotations:
    meta.upbound.io/example-id: connector/v1alpha1/aws
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    authParamsSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    extraConfig: |-
      ${jsonencode(
          {
            "skipOrganizationScan" : true,
            "optedInRegions" : ["us-east-1"],
            "excludedAccounts" : [],
            "excludedOUs" : [],
            "auditLogMonitorEnabled" : false
          }
        )}
    name: example
