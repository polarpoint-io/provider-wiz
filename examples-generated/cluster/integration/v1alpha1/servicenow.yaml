apiVersion: integration.wiz.polarpoint.io/v1alpha1
kind: ServiceNow
metadata:
  annotations:
    meta.upbound.io/example-id: integration/v1alpha1/servicenow
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    name: default
    scope: All Resources, Restrict this Integration to global roles only
    servicenowPasswordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    servicenowUrl: ${var.servicename_url}
    servicenowUsername: ${var.servicenow_username}
