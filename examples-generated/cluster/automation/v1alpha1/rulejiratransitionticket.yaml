apiVersion: automation.wiz.polarpoint.io/v1alpha1
kind: RuleJiraTransitionTicket
metadata:
  annotations:
    meta.upbound.io/example-id: automation/v1alpha1/rulejiratransitionticket
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    description: example description
    enabled: true
    filters: |-
      ${jsonencode({
          "severity" : [
            "CRITICAL"
          ]
        })}
    integrationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    jira_add_issues_report: false
    jira_project_key: PROJ
    jiraAdvancedFields: |-
      ${jsonencode({
          "resolution" : "Done"
        })}
    jiraAttachEvidenceCsv: false
    jiraComment: Resolved via Wiz Automation
    jiraCommentOnTransition: true
    jiraTransitionId: Resolved
    name: example
    triggerSource: ISSUES
    triggerType:
    - RESOLVED

---

apiVersion: integration.wiz.polarpoint.io/v1alpha1
kind: Jira
metadata:
  annotations:
    meta.upbound.io/example-id: automation/v1alpha1/rulejiratransitionticket
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    jiraPasswordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    jiraUrl: ${var.jira_url}
    jiraUsername: ${var.jira_username}
    name: default
    scope: All Resources, Restrict this Integration to global roles only
