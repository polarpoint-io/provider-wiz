apiVersion: automation.wiz.polarpoint.io/v1alpha1
kind: RuleServiceNowUpdateTicket
metadata:
  annotations:
    meta.upbound.io/example-id: automation/v1alpha1/ruleservicenowupdateticket
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    description: example description
    enabled: true
    filters: |-
      ${jsonencode({
          "severity" : [
            "CRITICAL"
          ]
        })}
    integrationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    name: example
    servicenowAttachIssuesReport: true
    servicenowFields: |-
      ${jsonencode({
          "state" : "Closed"
        })}
    servicenowTableName: incident
    triggerSource: ISSUES
    triggerType:
    - RESOLVED

---

apiVersion: integration.wiz.polarpoint.io/v1alpha1
kind: ServiceNow
metadata:
  annotations:
    meta.upbound.io/example-id: automation/v1alpha1/ruleservicenowupdateticket
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    name: default
    scope: All Resources, Restrict this Integration to global roles only
    servicenowPasswordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    servicenowUrl: ${var.servicename_url}
    servicenowUsername: ${var.servicenow_username}
