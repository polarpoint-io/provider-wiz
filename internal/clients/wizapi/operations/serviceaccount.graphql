fragment ServiceAccountFields on ServiceAccount {
  id
  name
  clientId
  scopes
  type
  createdAt
  lastRotatedAt
  assignedProjects { id }
}

query GetServiceAccount(
  $id: ID!
) {
  serviceAccount(id: $id) {
    ...ServiceAccountFields
  }
}

# The client secret is only returned here, so it is read on create alone.
# @genqlient(for: "CreateServiceAccountInput.assignedProjectIds", omitempty: true)
# @genqlient(for: "CreateServiceAccountInput.type", omitempty: true)
mutation CreateServiceAccount(
  $input: CreateServiceAccountInput!
) {
  createServiceAccount(input: $input) {
    serviceAccount {
      ...ServiceAccountFields
      clientSecret
    }
  }
}

mutation DeleteServiceAccount(
  $input: DeleteServiceAccountInput!
) {
  deleteServiceAccount(input: $input) {
    _stub
  }
}
