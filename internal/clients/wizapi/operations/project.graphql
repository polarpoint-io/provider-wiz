# @genqlient(for: "ProjectCloudAccountLinkInput.resourceGroups", omitempty: true)
# @genqlient(for: "ProjectCloudAccountLinkInput.resourceTags", omitempty: true)
# @genqlient(for: "ProjectCloudAccountLinkInput.shared", omitempty: true)
# @genqlient(for: "ProjectCloudOrganizationLinkInput.resourceGroups", omitempty: true)
# @genqlient(for: "ProjectCloudOrganizationLinkInput.resourceTags", omitempty: true)
# @genqlient(for: "ProjectCloudOrganizationLinkInput.shared", omitempty: true)
# @genqlient(for: "ProjectKubernetesClusterLinkInput.namespaces", omitempty: true)
# @genqlient(for: "ProjectKubernetesClusterLinkInput.shared", omitempty: true)
mutation CreateProject(
  $input: CreateProjectInput!
) {
  createProject(input: $input) { project { ...ProjectFields } }
}

