fragment ProjectFields on Project {
  id
  name
  slug
  description
  isFolder
  archived
  businessUnit
  identifiers
  ancestorProjects { id }
  projectOwners { id }
  securityChampions { id }
  riskProfile {
    businessImpact
    isActivelyDeveloped
    hasAuthentication
    hasExposedAPI
    isInternetFacing
    isCustomerFacing
    storesData
    sensitiveDataTypes
    isRegulated
    regulatoryStandards
  }
  cloudAccountLinks {
    cloudAccount { id }
    environment
    resourceGroups
    resourceTags { key value }
    shared
  }
  cloudOrganizationLinks {
    cloudOrganization { id }
    environment
    resourceGroups
    resourceTags { key value }
    shared
  }
  kubernetesClustersLinks {
    kubernetesCluster { id }
    environment
    namespaces
    shared
  }
}

query GetProject($id: ID!) {
  project(id: $id) { ...ProjectFields }
}

# Optional input fields are omitted rather than sent as null, so Wiz
# keeps its defaults and a patch only touches the fields it carries.
