apiVersion: iam.wiz.m.polarpoint.io/v1alpha1
kind: ServiceAccount
metadata:
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    name: crossplane-example
    type: THIRD_PARTY
    scopes:
      - read:projects
    assignedProjectsRefs:
      - name: example
  # Receives client_id and client_secret. Wiz returns the secret only once,
  # when the service account is created.
  writeConnectionSecretToRef:
    name: wiz-example-service-account
  providerConfigRef:
    name: default
    kind: ClusterProviderConfig
