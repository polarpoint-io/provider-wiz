---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: projects.project.wiz.polarpoint.io
spec:
  group: project.wiz.polarpoint.io
  names:
    categories:
    - crossplane
    - managed
    - wiz
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Project is a Wiz project, managed directly through the Wiz GraphQL API.
          Projects group cloud resources by owner or purpose. Wiz cannot delete
          projects, so deleting this resource archives the project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProjectSpec defines the desired state of a Project.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: |-
                  Parameters are the configurable fields of a Wiz project. They follow the
                  Wiz GraphQL CreateProjectInput.

                  List fields left unset are not managed; set one to [] to clear it in Wiz.
                  They carry no omitempty, so an explicit empty list survives a round trip.
                properties:
                  archived:
                    description: |-
                      Archived projects are inactive. Wiz cannot delete projects, so deleting
                      this resource archives the project.
                    type: boolean
                  businessUnit:
                    type: string
                  cloudAccountLinks:
                    items:
                      description: |-
                        CloudAccountLink scopes a cloud account (subscription) into the project.
                        It replaces the separate CloudAccountLink kind of the Terraform-based API.
                      properties:
                        cloudAccount:
                          description: CloudAccount is the Wiz internal ID of the
                            cloud account.
                          type: string
                        environment:
                          description: Environment of the resources linked to a project.
                          enum:
                          - PRODUCTION
                          - STAGING
                          - DEVELOPMENT
                          - TESTING
                          - OTHER
                          type: string
                        resourceGroups:
                          description: ResourceGroups limits the link to these resource
                            groups.
                          items:
                            type: string
                          type: array
                        resourceTags:
                          description: ResourceTags limits the link to resources carrying
                            these tags.
                          items:
                            description: ResourceTag is a cloud resource tag used
                              to scope a link.
                            properties:
                              key:
                                type: string
                              value:
                                type: string
                            required:
                            - key
                            - value
                            type: object
                          type: array
                        shared:
                          description: Shared marks the account as shared with other
                            projects.
                          type: boolean
                      required:
                      - cloudAccount
                      - environment
                      type: object
                    type: array
                  cloudOrganizationLinks:
                    items:
                      description: CloudOrganizationLink scopes a cloud organization
                        into the project.
                      properties:
                        cloudOrganization:
                          description: CloudOrganization is the Wiz internal ID of
                            the cloud organization.
                          type: string
                        environment:
                          description: Environment of the resources linked to a project.
                          enum:
                          - PRODUCTION
                          - STAGING
                          - DEVELOPMENT
                          - TESTING
                          - OTHER
                          type: string
                        resourceGroups:
                          items:
                            type: string
                          type: array
                        resourceTags:
                          items:
                            description: ResourceTag is a cloud resource tag used
                              to scope a link.
                            properties:
                              key:
                                type: string
                              value:
                                type: string
                            required:
                            - key
                            - value
                            type: object
                          type: array
                        shared:
                          type: boolean
                      required:
                      - cloudOrganization
                      - environment
                      type: object
                    type: array
                  description:
                    type: string
                  identifiers:
                    description: Identifiers are free-form external identifiers for
                      the project.
                    items:
                      type: string
                    type: array
                  isFolder:
                    description: |-
                      IsFolder makes this a folder project that holds other projects.
                      Immutable.
                    type: boolean
                    x-kubernetes-validations:
                    - message: isFolder is immutable
                      rule: self == oldSelf
                  kubernetesClusterLinks:
                    items:
                      description: KubernetesClusterLink scopes a Kubernetes cluster
                        into the project.
                      properties:
                        environment:
                          description: Environment of the resources linked to a project.
                          enum:
                          - PRODUCTION
                          - STAGING
                          - DEVELOPMENT
                          - TESTING
                          - OTHER
                          type: string
                        kubernetesCluster:
                          description: KubernetesCluster is the Wiz internal ID of
                            the cluster.
                          type: string
                        namespaces:
                          description: Namespaces limits the link to these namespaces.
                          items:
                            type: string
                          type: array
                        shared:
                          type: boolean
                      required:
                      - environment
                      - kubernetesCluster
                      type: object
                    type: array
                  name:
                    description: Name of the project.
                    type: string
                  parentProjectId:
                    description: ParentProjectID is the Wiz ID of the folder project
                      this project sits in.
                    type: string
                  projectOwners:
                    description: ProjectOwners are Wiz user IDs.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  riskProfile:
                    description: RiskProfile describes the business context of a project.
                    properties:
                      businessImpact:
                        description: 'BusinessImpact of the project: LBI (low), MBI
                          (medium) or HBI (high).'
                        enum:
                        - LBI
                        - MBI
                        - HBI
                        type: string
                      hasAuthentication:
                        description: YesNoUnknown is a tri-state answer used by a
                          project's risk profile.
                        enum:
                        - "YES"
                        - "NO"
                        - UNKNOWN
                        type: string
                      hasExposedAPI:
                        description: YesNoUnknown is a tri-state answer used by a
                          project's risk profile.
                        enum:
                        - "YES"
                        - "NO"
                        - UNKNOWN
                        type: string
                      isActivelyDeveloped:
                        description: YesNoUnknown is a tri-state answer used by a
                          project's risk profile.
                        enum:
                        - "YES"
                        - "NO"
                        - UNKNOWN
                        type: string
                      isCustomerFacing:
                        description: YesNoUnknown is a tri-state answer used by a
                          project's risk profile.
                        enum:
                        - "YES"
                        - "NO"
                        - UNKNOWN
                        type: string
                      isInternetFacing:
                        description: YesNoUnknown is a tri-state answer used by a
                          project's risk profile.
                        enum:
                        - "YES"
                        - "NO"
                        - UNKNOWN
                        type: string
                      isRegulated:
                        description: YesNoUnknown is a tri-state answer used by a
                          project's risk profile.
                        enum:
                        - "YES"
                        - "NO"
                        - UNKNOWN
                        type: string
                      regulatoryStandards:
                        description: RegulatoryStandards that apply, for example ISO_27001
                          or SOC.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      sensitiveDataTypes:
                        description: SensitiveDataTypes the project stores, for example
                          PII or PCI.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      storesData:
                        description: YesNoUnknown is a tri-state answer used by a
                          project's risk profile.
                        enum:
                        - "YES"
                        - "NO"
                        - UNKNOWN
                        type: string
                    type: object
                  securityChampions:
                    description: SecurityChampions are Wiz user IDs.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  slug:
                    description: |-
                      Slug is a short identifier, unique across all projects including
                      archived ones. Wiz generates one when unset. Immutable once set.
                    type: string
                    x-kubernetes-validations:
                    - message: slug is immutable
                      rule: self == oldSelf
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: slug cannot be removed once set
                  rule: '!has(oldSelf.slug) || has(self.slug)'
                - message: isFolder cannot be removed once set
                  rule: '!has(oldSelf.isFolder) || has(self.isFolder)'
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  This field is planned to replace the DeletionPolicy field in a future
                  release. Currently, both could be set independently and non-default
                  values would be honored if the feature flag is enabled. If both are
                  custom, the DeletionPolicy field will be ignored.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
                        default: Required
                        description: |-
                          Resolution specifies whether resolution of this reference is required.
                          The default is 'Required', which means the reconcile will fail if the
                          reference cannot be resolved. 'Optional' means this reference will be
                          a no-op if it cannot be resolved.
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        description: |-
                          Resolve specifies when this reference should be resolved. The default
                          is 'IfNotPresent', which will attempt to resolve the reference only when
                          the corresponding field is not present. Use 'Always' to resolve the
                          reference on every reconcile.
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
          status:
            description: ProjectStatus defines the observed state of a Project.
            properties:
              atProvider:
                description: Observation is the observed state of a Wiz project.
                properties:
                  ancestorProjectIds:
                    description: AncestorProjectIDs lists the folder projects above
                      this one.
                    items:
                      type: string
                    type: array
                  archived:
                    description: Archived as stored by Wiz.
                    type: boolean
                  id:
                    description: ID is the Wiz internal project ID, also the external
                      name.
                    type: string
                  slug:
                    description: Slug as stored by Wiz.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
